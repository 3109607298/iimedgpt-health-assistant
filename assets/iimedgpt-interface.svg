<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="IIMedGPT 智慧健康助手界面预览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf8ff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#073d7f"/><stop offset="1" stop-color="#092d66"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#147fe0"/><stop offset="1" stop-color="#10c7ad"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#1d5f8d" flood-opacity=".12"/></filter>
    <style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#123764}.m{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#7290ae}.w{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#fff}.h{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#123764;font-weight:700}</style>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/><rect width="246" height="810" fill="url(#nav)"/>
  <rect x="20" y="22" width="48" height="48" rx="13" fill="url(#teal)"/><path d="M31 47h25M43 35v24" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="80" y="47" class="w" font-size="27" font-weight="700">IIMedGPT</text><text x="80" y="69" class="w" font-size="12" opacity=".8">智慧健康助手</text>
  <rect x="14" y="107" width="218" height="55" rx="10" fill="#0a76b7"/><rect x="14" y="107" width="4" height="55" rx="2" fill="#4fe2cf"/>
  <g class="w" font-size="18"><text x="54" y="141">智能问诊</text><text x="54" y="207">健康档案</text><text x="54" y="273">知识库检索</text><text x="54" y="339">病例分析</text><text x="54" y="405">用药与风险提示</text><text x="54" y="471">系统设置</text></g>
  <text x="28" y="728" class="w" font-size="16" opacity=".82">AI 让专业医学知识</text><text x="28" y="753" class="w" font-size="16" opacity=".82">惠及每一个人</text>
  <rect x="272" y="18" width="1140" height="48" rx="11" fill="#fff" stroke="#deecf8"/><text x="298" y="48" class="m" font-size="15">◉  以人工智能，助力更好的医疗健康服务</text>
  <rect x="1146" y="29" width="190" height="28" rx="7" fill="#f5f9fd"/><text x="1160" y="48" class="m" font-size="12">搜索疾病、药物、指南文献…</text>
  <text x="280" y="116" class="h" font-size="32">您好，我是 IIMedGPT 智慧健康助手</text><text x="280" y="146" class="m" font-size="18">基于医学知识与健康数据，为您提供结构化辅助分析</text>
  <g filter="url(#s)"><rect x="272" y="174" width="268" height="370" rx="16" fill="#fff"/><rect x="557" y="174" width="596" height="370" rx="16" fill="#fff"/><rect x="1170" y="82" width="242" height="553" rx="16" fill="#fff"/></g>
  <circle cx="305" cy="207" r="18" fill="#e8f4ff"/><text x="336" y="212" class="h" font-size="17">患者信息</text><text x="470" y="212" class="m" font-size="12">今天 10:24</text>
  <rect x="288" y="235" width="236" height="94" rx="10" fill="#f2f8fe"/><text x="304" y="264" class="t" font-size="16">患者：张某，男，52岁</text><text x="304" y="291" class="t" font-size="16">主诉：口渴、多饮、乏力 3 月</text><text x="304" y="318" class="t" font-size="16">血糖：空腹 8.6 mmol/L</text>
  <rect x="288" y="343" width="236" height="108" rx="10" fill="#eaf4ff"/><text x="304" y="374" class="m" font-size="14">患者近 3 个月出现口渴、多饮，</text><text x="304" y="398" class="m" font-size="14">伴乏力、体重下降，既往有</text><text x="304" y="422" class="m" font-size="14">高血压病史。</text>
  <rect x="581" y="195" width="42" height="42" rx="13" fill="url(#teal)"/><text x="639" y="222" class="h" font-size="18">IIMedGPT 智慧健康助手</text>
  <rect x="582" y="253" width="545" height="77" rx="11" fill="#eaf6ff"/><text x="609" y="280" class="h" font-size="16">初步分析</text><text x="609" y="305" class="m" font-size="14">根据症状及空腹血糖，建议结合更多检查结果综合判断。</text>
  <rect x="582" y="340" width="545" height="88" rx="11" fill="#fff3ee"/><text x="609" y="367" fill="#ef6540" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700">风险提示</text><text x="609" y="393" class="m" font-size="14">• 血糖持续偏高时，应尽快复诊并完善相关检查。</text><text x="609" y="416" class="m" font-size="14">• 明显不适或低血糖症状时请及时就医。</text>
  <rect x="582" y="438" width="545" height="82" rx="11" fill="#eafaf6"/><text x="609" y="465" fill="#0a9d86" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700">建议检查与健康管理</text><text x="609" y="491" class="m" font-size="14">1. 结合糖化血红蛋白、餐后血糖等指标进一步评估。</text><text x="609" y="513" class="m" font-size="14">2. 规律饮食、适量运动，进行个体化健康管理。</text>
  <rect x="272" y="562" width="881" height="72" rx="13" fill="#fff" stroke="#cae0f0" stroke-width="1.5"/><text x="293" y="604" class="m" font-size="16">请输入病例、检查结果或健康咨询问题……</text><rect x="1067" y="576" width="68" height="43" rx="10" fill="url(#teal)"/><text x="1082" y="604" class="w" font-size="16" font-weight="700">发送</text>
  <text x="1192" y="118" class="h" font-size="18">▮ 医学知识检索</text><text x="1365" y="118" class="m" font-size="12">更多 ›</text><rect x="1184" y="134" width="214" height="32" rx="6" fill="#f6faff"/><text x="1194" y="155" fill="#0b8eae" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" font-weight="700">临床指南　 医学文献　 知识图谱</text>
  <rect x="1184" y="179" width="214" height="116" rx="10" fill="#fff" stroke="#d6e6f3"/><text x="1197" y="207" class="h" font-size="14">2 型糖尿病诊疗指南</text><text x="1197" y="230" class="m" font-size="11">中华医学会糖尿病学分会</text><text x="1197" y="258" class="m" font-size="11">诊断标准与综合管理建议……</text><text x="1197" y="283" class="m" font-size="10">2024-05　◉ 2.3 万阅读</text>
  <rect x="1184" y="307" width="214" height="116" rx="10" fill="#fff" stroke="#d6e6f3"/><text x="1197" y="335" class="h" font-size="14">血糖异常生活方式干预</text><text x="1197" y="359" class="m" font-size="11">随访管理资料</text><text x="1197" y="388" class="m" font-size="11">围绕饮食、运动与长期管理……</text>
  <rect x="1184" y="436" width="214" height="181" rx="10" fill="#fbfeff" stroke="#d6e6f3"/><text x="1197" y="461" fill="#0a9d86" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">药食同源知识图谱</text><ellipse cx="1292" cy="535" rx="48" ry="24" fill="#0aa89d"/><text x="1262" y="540" class="w" font-size="13" font-weight="700">2 型糖尿病</text><g stroke="#1bbbaa" stroke-width="1.5"><path d="M1292 511V480"/><path d="M1245 526l-35-18"/><path d="M1339 526l34-18"/><path d="M1247 548l-36 25"/><path d="M1337 548l37 25"/></g><g class="m" font-size="10"><text x="1274" y="478">高血糖</text><text x="1189" y="507">胰岛素抵抗</text><text x="1334" y="507">生活方式干预</text><text x="1195" y="581">药物治疗</text><text x="1338" y="581">低血糖风险</text></g>
</svg>
